[project]
name = "auction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kyle-dotterrer_usma", email = "kyle.dotterrer@westpoint.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.62.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
auction = "auction:main"
auction-etl = "auction.etl:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
qa = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "isort>=9.0.2",
    "mypy>=2.4.1",
]

[tool.black]
line-length = 80
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 80
src_paths = ["src"]